<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="movieBox.css">
    <script src="movieBox.js" defer></script>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Basic&family=Birthstone&family=Caprasimo&family=Delicious+Handrawn&family=Edu+VIC+WA+NT+Hand+Pre:wght@400..700&family=Geist+Pixel&family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Mea+Culpa&family=Meie+Script&family=Monsieur+La+Doulaise&family=Orbitron:wght@400..900&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand&family=Sevillana&family=Slabo+27px&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" 
rel="stylesheet">

    <!-- swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"/>
</head>

<body>
    <header>
        <a href="#" class="logo">
            <i class="fa-solid fa-clapperboard" style="color: white;"></i>
            Movies
        </a>
        <div><i class="fa-solid fa-bars" style="color: rgb(255, 255, 255);"></i></div>
        <ul class="navbar">
            <li><a href="#home">Home</a></li>
            <li><a href="#movies">Movies</a></li>
            <li><a href="#coming">Coming</a></li>
            <li><a href="#newsletter">Newsletter</a></li>
        </ul>
        <a href="#" class="btn">Sign In</a>

    </header>

    <section class="home swiper" id="home">
        <div class="swiper-wrapper">
            <div class="swiper-slide container">
                <img src="./Imgs/HP.jpg" alt="">
                <div class="home-text">
                    <span>Harry Potter</span>
                    <h1>the philosopher<br> Stone</h1>
                    <a href="#" class="btn">Book Now</a>
                    <a href="#" class="play">
                        <i class="fa-regular fa-circle-play" ></i>
                    </a>
                </div>
            </div>

            <div class="swiper-slide container">
                <img src="./Imgs/Divergent.jpg" alt="">
                <div class="home-text">
                    <span>Distopian movie</span>
                    <h1>Divergents</h1>
                    <a href="#" class="btn">Book Now</a>
                    <a href="#" class="play">
                        <i class="fa-regular fa-circle-play"></i>
                    </a>
                </div>
            </div>

            <div class="swiper-slide container">
                <img src="./Imgs/PDC.jpg" alt="">
                <div class="home-text">
                    <span>Pirates Of The Caribbean</span>
                    <h1>The Curse Of<br>The Black Pearl</h1>
                    <a href="#" class="btn">Book Now</a>
                    <a href="#" class="play">
                        <i class="fa-regular fa-circle-play"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="swiper-pagination"></div>
    </section>
    <section class="movies" id="movies">
        <h2 class="heading">Opening this weekend</h2>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

</body>
</html>
